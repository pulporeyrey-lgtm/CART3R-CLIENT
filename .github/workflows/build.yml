
name: Build CART3R CLIENT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'CART3R_CLIENT_ANDROID_GITHUB.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip CART3R_CLIENT_ANDROID_GITHUB.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/CART3R_CLIENT_ANDROID
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CART3R-CLIENT-APK
          path: source/CART3R_CLIENT_ANDROID/app/build/outputs/apk/debug/app-debug.apk
